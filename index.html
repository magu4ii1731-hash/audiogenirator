<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Аудиостудия</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🎧 Бесплатная ИИ-Студия Аудиокниг</h1>
        <p>Разделение на главы, фоновая музыка и озвучка без лимитов</p>
    </header>

    <main>
        <div class="form-group">
            <label for="textInput">Текст книги (для разделения используйте слова "Глава 1", "Глава 2" или знаки "***"):</label>
            <textarea id="textInput" placeholder="Пример текста:&#10;Глава 1. Пробуждение&#10;Здесь пишется текст первой главы...&#10;&#10;Глава 2. Новые горизонты&#10;А здесь начинается текст второй главы..."></textarea>
        </div>

        <div class="settings-grid">
            <div class="field">
                <label for="voiceSelect">👤 Голос ИИ:</label>
                <select id="voiceSelect">
                    <option value="ru_female_1">Света (Женский — чистый)</option>
                    <option value="ru_male_1">Дима (Мужской — глубокий)</option>
                </select>
            </div>

            <div class="field">
                <label for="speedSelect">⚡ Скорость речи:</label>
                <select id="speedSelect">
                    <option value="0.9">Замедленная (0.9x)</option>
                    <option value="1.0" selected>Обычная (1.0x)</option>
                    <option value="1.1">Ускоренная (1.1x)</option>
                    <option value="1.2">Быстрая (1.2x)</option>
                </select>
            </div>

            <div class="field">
                <label for="musicSelect">🎵 Фоновое аудио:</label>
                <select id="musicSelect">
                    <option value="none">Без музыки (Только голос)</option>
                    <option value="ambient">Эмбиент (Космос / Научпоп)</option>
                    <option value="drama">Фортепиано (Драма / Детектив)</option>
                    <option value="fantasy">Оркестр (Сказки / Фэнтези)</option>
                </select>
            </div>

            <div class="field">
                <label for="musicVolume">🔊 Громкость фона:</label>
                <select id="musicVolume">
                    <option value="0.05">Очень тихо (5%)</option>
                    <option value="0.12" selected>Оптимально (12%)</option>
                    <option value="0.20">Громко (20%)</option>
                </select>
            </div>
        </div>

        <button id="startBtn" onclick="buildAudiobook()">⚡ Запустить озвучку книги</button>

        <div id="loader" class="loader-box" style="display: none;">
            <div class="spinner"></div>
            <p id="loaderText">Подключение к ИИ-облаку...</p>
        </div>

        <div id="results" class="results-box" style="display: none;">
            <h2>🎙 Сгенерированные аудио-главы:</h2>
            <div id="chaptersList"></div>
        </div>
    </main>
</div>

<script>
    // Потоковые аудио-ссылки для наложения музыкального фона
    const AUDIO_RESOURCES = {
        ambient: "https://google.com",
        drama: "https://google.com",
        fantasy: "https://google.com"
    };

    // Умное разделение текста по главам
    function parseTextToChapters(rawText) {
        const pattern = /(?=Глава\s+\d+|Часть\s+\d+|\*\*\*)/i;
        let segments = rawText.split(pattern);
        let list = [];
        let counter = 1;

        segments.forEach(seg => {
            let cleanText = seg.trim();
            if (!cleanText) return;

            let firstLine = cleanText.split('\n')[0].trim();
            let title = firstLine;

            if (title.length > 40 || !title.match(/Глава|Часть|\*\*\*/i)) {
                title = `Часть ${counter++}`;
            } else {
                title = title.replace(/\*\*\*/g, `Глава ${counter++}`);
            }
            list.push({ title: title, content: cleanText });
        });

        if (list.length === 0 && rawText.trim()) {
            list.push({ title: "Полная книга", content: rawText.trim() });
        }
        return list;
    }

    async function buildAudiobook() {
        const text = document.getElementById('textInput').value.trim();
        const voice = document.getElementById('voiceSelect').value;
        const speed = parseFloat(document.getElementById('speedSelect').value);
        const music = document.getElementById('musicSelect').value;
        const volume = parseFloat(document.getElementById('musicVolume').value);

        const btn = document.getElementById('startBtn');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const results = document.getElementById('results');
        const listContainer = document.getElementById('chaptersList');

        if (!text) {
            alert('Пожалуйста, введите текст.');
            return;
        }

        const chapters = parseTextToChapters(text);
        
        btn.disabled = true;
        loader.style.display = 'flex';
        listContainer.innerHTML = '';
        results.style.display = 'block';

        let musicBuffer = null;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        if (music !== 'none') {
            loaderText.innerText = "Загрузка фоновой музыки в кэш...";
            try {
                let res = await fetch(AUDIO_RESOURCES[music]);
                let buf = await res.arrayBuffer();
                musicBuffer = await audioCtx.decodeAudioData(buf);
            } catch (e) {
                console.error("Ошибка загрузки музыки:", e);
            }
        }

        // Запрос к бесплатному ИИ-серверу для каждой главы по очереди
        for (let i = 0; i < chapters.length; i++) {
            let ch = chapters[i];
            loaderText.innerText = `Озвучка: ${ch.title} (Часть ${i + 1} из ${chapters.length})...`;

            try {
                let apiResponse = await fetch("https://hf.space", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: ch.content, voice: voice, speed: speed })
                });

                if (!apiResponse.ok) throw new Error("API Error");

                let blob = await apiResponse.blob();

                if (musicBuffer) {
                    blob = await mergeTracks(blob, musicBuffer, volume, audioCtx);
                }

                let url = URL.createObjectURL(blob);
                
                let row = document.createElement('div');
                row.className = 'chapter-card';
                row.innerHTML = `
                    <div class="card-title">📄 ${ch.title}</div>
                    <audio controls src="${url}"></audio>
                    <a class="btn-download" href="${url}" download="${ch.title}.wav">📥 Скачать WAV</a>
                `;
                listContainer.appendChild(row);

            } catch (err) {
                let errRow = document.createElement('div');
                errRow.className = 'chapter-card error';
                errRow.innerText = `❌ Сбой в "${ch.title}". Текст фрагмента слишком огромный. Попробуйте разделить его на абзацы поменьше.`;
                listContainer.appendChild(errRow);
            }
        }

        loader.style.display = 'none';
        btn.disabled = false;
    }

    async function mergeTracks(voiceBlob, musicBuffer, musicVolume, ctx) {
        let voiceArrBuf = await voiceBlob.arrayBuffer();
        let voiceBuffer = await ctx.decodeAudioData(voiceArrBuf);

        let duration = voiceBuffer.duration;
        let sampleRate = voiceBuffer.sampleRate;
        let totalSamples = sampleRate * duration;
        
        let outBuffer = ctx.createBuffer(2, totalSamples, sampleRate);

        for (let ch = 0; ch < 2; ch++) {
            let outData = outBuffer.getChannelData(ch);
            let voiceData = voiceBuffer.getChannelData(ch % voiceBuffer.numberOfChannels);
            let musicData = musicBuffer.getChannelData(ch % musicBuffer.numberOfChannels);

            for (let i = 0; i < totalSamples; i++) {
                let mSample = musicData[i % musicBuffer.length] * musicVolume;
                let vSample = voiceData[i];
                outData[i] = Math.max(-1, Math.min(1, vSample + mSample));
            }
        }
        return encodeWav(outBuffer);
    }

    function encodeWav(buffer) {
        let nCh = buffer.numberOfChannels;
        let len = buffer.length * nCh * 2 + 44;
        let arrBuf = new ArrayBuffer(len);
        let view = new DataView(arrBuf);
        let channels = [];
        let i;
        let sample;
        let offset = 0;
        let pos = 0;

        const write16 = (d) => { view.setUint16(pos, d, true); pos += 2; };
        const write32 = (d) => { view.setUint32(pos, d, true); pos += 4; };

        write32(0x46464952); 
        write32(len - 8);
        write32(0x45564157); 
        write32(0x20746d66); 
        write32(16);
        write16(1);
        write16(nCh);
        write32(buffer.sampleRate);
        write32(buffer.sampleRate * 2 * nCh);
        write16(nCh * 2);
        write16(16);
        write32(0x61746164); 
        write32(len - pos - 4);

        for (i = 0; i < buffer.numberOfChannels; i++) {
            channels.push(buffer.getChannelData(i));
        }

        while (pos < len) {
            for (i = 0; i < nCh; i++) {
                sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF);
                view.setInt16(pos, sample, true); 
                pos += 2;
            }
offset++;
}
return new Blob([arrBuf], { type: "audio/wav" });
}
